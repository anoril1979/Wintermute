# ============================================================
# retrieval.yaml — Retrieval configuration
# Tuning knobs of the retrieval orchestrator and its agents.
# Storage-specific paths/collections do NOT live here: the
# vector store folder and collection names belong to
# setup.yaml (vector_db section) — retrieval only refers to
# them by key.
# ============================================================

# Number of chunks fetched per semantic query (the "k" of top-k).
# The retrieval intent may override it per request, within max_top_k.
default_top_k: 6

# Hard ceiling for a per-request top_k: a user (or a malformed LLM
# answer) asking for 500 chunks must not flood the answerer's context.
max_top_k: 20

# Minimum cosine similarity (ChromaDB returns a distance; the client
# converts it to similarity = 1 - distance) for a hit to be kept.
# Cosine distance for these embedding models: <0.35 similarity is noise.
# NOTE: the dimension/metric of a collection is frozen by its first write
# (setup.yaml note) — retuning this only affects the filter, not the data.
min_score: 0.35

# The llm.yaml role that provides the QUERY embeddings. It MUST be the
# same model that embedded the corpus (the "embedding" role) — embedding
# the question with another model would compare incomparable vectors.
embedding_role: "embedding"

# Query-side instruction for instruction-aware embedding models (asymmetric
# retrieval). qwen3-embedding was trained to receive QUERIES wrapped as
# "Instruct: <task>\nQuery: <text>" while DOCUMENTS are embedded raw —
# Ollama does not apply this format itself, so the retrieval agent prepends
# this prefix to the question right before the /api/embed call. The stored
# corpus is untouched (no re-indexing); only query vectors change, so
# re-tune min_score if you edit or empty this value.
# Empty string (or an absent key) disables the instruction — keep it empty
# for embedding models without such a query protocol.
query_instruction: "Instruct: Given a user query about a tabletop RPG fictional world, retrieve the document passages that answer or discuss it\nQuery: "

# The vector_db.collections key (setup.yaml) holding the source content
# chunks indexed by the SourceIndexingAgent. Knowledge chunks get their
# own key when the knowledge layer lands.
source_collection_key: "source_chunks"
