# ============================================================
# setup.yaml — Paramètres généraux (non sensibles)
# Les valeurs entre <...> sont des placeholders à remplacer.
# Tous les identifiants et secrets sont exclusivement définis
# dans le fichier .env à la racine du projet — jamais ici.
# ============================================================

api:
  host: "127.0.0.1"
  port: 8000
  reload: true                            # utile en dev, à désactiver en prod

ollama:
  base_url: "http://localhost:11434"

# Réponses aux requêtes meta du front-end (titre de conversation, tags,
# suggestions de suivi) : true = le MetaRequestAgent y répond via son rôle
# LLM (interface consistante, coût faible) ; false = réponse fixe à coût
# zéro (machines peu puissantes).
reply_to_meta_request: true

logging:
  level: "INFO"
  format: "%(asctime)s - [%(correlation_id)s] - %(name)s - %(levelname)s - %(message)s"
  # Durable log file (relative to the project root; "" disables file logging).
  file: "data/logs/wintermute.log"
  # Rotation of the log file: wintermute.log, then .log.1, .log.2, ...
  max_bytes: 5242880                        # 5 MiB per file
  backup_count: 3                           # keep 3 rotated files

# Vector database — ChromaDB in embedded mode: everything it persists
# (SQLite metadata, HNSW segments) lives in a simple folder, no server
# process. The embedding model itself is NOT configured here: it is the
# "embedding" role of config/llm.yaml.
vector_db:
  # Working folder of the embedded store (relative to the project root;
  # absolute paths are also accepted).
  path: "data/vector"

  # The two collections:
  #   source_chunks    — chunks of the DocumentExtract true content (atomic
  #                      text blocks) plus every summarized level above them
  #                      (sections, pages, chapters, whole document).
  #   knowledge_chunks — chunks from the knowledge markdown files.
  # NOTE: a collection's vector dimension is frozen by its first write —
  # switching the embedding role's model later means re-embedding everything.
  collections:
    source_chunks: "source_chunks"
    knowledge_chunks: "knowledge_chunks"

