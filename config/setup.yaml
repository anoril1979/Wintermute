# ============================================================
# setup.yaml — Paramètres généraux (non sensibles)
# Les valeurs entre <...> sont des placeholders à remplacer.
# Tous les identifiants et secrets sont exclusivement définis
# dans le fichier .env à la racine du projet — jamais ici.
# ============================================================

api:
  host: "127.0.0.1"
  port: 8000
  reload: true                            # utile en dev, à désactiver en prod

ollama:
  base_url: "http://localhost:11434"

# Réponses aux requêtes meta du front-end (titre de conversation, tags,
# suggestions de suivi) : true = le MetaRequestAgent y répond via son rôle
# LLM (interface consistante, coût faible) ; false = réponse fixe à coût
# zéro (machines peu puissantes).
reply_to_meta_request: true

# Analyze-and-dispatch routing (src/routing): ONE LLM analysis explodes
# each user prompt into structured requests grouped by scope (retrieval /
# general) and the dispatcher runs them deterministically (retrievals
# first, then general). Ingestion is NOT a scope: document ingestion is a
# CLI operation (scripts/ingest.py), unreachable from the chat. The cap
# bounds how many requests a single prompt may yield: a confused analysis
# looping on the split is rejected as a malformed answer, not executed.
routing:
  max_requests_per_prompt: 8

logging:
  level: "DEBUG"
  format: "%(asctime)s - [%(correlation_id)s] - %(name)s - %(levelname)s - %(message)s"
  # Durable main log (relative to the project root; absolute paths are also
  # accepted; "" disables file logging).
  main_log: "data/logs/wintermute.log"
  # Rotation of the main log: wintermute.log, then .log.1, .log.2, ...
  max_bytes: 5242880                        # 5 MiB per file
  backup_count: 3                           # keep 3 rotated files

# Vector database — ChromaDB in embedded mode: everything it persists
# (SQLite metadata, HNSW segments) lives in a simple folder, no server
# process. The embedding model itself is NOT configured here: it is the
# "embedding" role of config/llm.yaml.
vector_db:
  # Working folder of the embedded store (relative to the project root;
  # absolute paths are also accepted).
  path: "data/vector"

 # Texts per embedding HTTP call (SourceIndexingAgent batching): one
  # round-trip per batch. qwen3-embedding handles 32 comfortably on a
  # workstation; lower it for low-VRAM machines.
  embedding_batch_size: 32

  # The two collections:
  #   source_chunks    — chunks of the DocumentExtract true content (atomic
  #                      text blocks) plus every summarized level above them
  #                      (sections, pages, chapters, whole document).
  #   knowledge_chunks — chunks from the knowledge markdown files.
  # NOTE: a collection's vector dimension is frozen by its first write —
  # switching the embedding role's model later means re-embedding everything.
  collections:
    source_chunks: "source_chunks"
    knowledge_chunks: "knowledge_chunks"

# ------------------------------------------------------------
# Document governance — the origin vocabulary is USER-DEFINED.
# ------------------------------------------------------------
# Every ingested document carries an origin label recording where it comes
# from, so a retrieved piece of information can be trusted (or distrusted)
# accordingly, and conflicts arbitrated. The vocabulary below is yours:
# adapt it, rename entries, add or remove them to fit YOUR usage context.
# The system treats them as opaque lowercase labels — nothing is hardcoded.
#
# The FIRST entry is the default applied when an ingestion is run without
# an explicit origin (reported as "unverified" by the extraction
# validation, so an implicit default is always visible).
#
# Labels are stored verbatim (lowercased) in the extraction/summarized
# JSONs, the vector metadata, and later the SQL and markdown layers.
documents:
  origins:
    - "canon"       # official sources of the universe (books, supplements...)
    - "community"   # fan-made content (may contradict canon)
    - "MdA"         # user-created/modified content (private sessions, homebrew)

